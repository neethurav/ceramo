info:
  name: Reset Password
  type: http
  seq: 4

http:
  method: POST
  url: http://127.0.0.1:8000/api/change-password
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"current_password\": \"password123\",\r

      \    \"new_password\": \"newpassword123\",\r

      \    \"new_password_confirmation\": \"newpassword123\"\r

      }"
  auth:
    type: bearer
    token: "{{auth_secret_028q}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
