      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"name\": \"Square Feet\",\r

      \    \"abbreviation\": \"SqFt\",\r

      \    \"is_active\": \"1\"\r

      }"
  auth:
    type: bearer
    token: "{{auth_secret_08wg}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
