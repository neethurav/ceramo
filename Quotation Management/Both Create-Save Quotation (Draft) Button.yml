info:
  name: Both Create/Save Quotation (Draft) Button
  type: http
  seq: 7

http:
  method: POST
  url: https://neethu.astradevelops.in/ceramo/public/api/quotations
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer 137|PzPKN1iGJJXQC05sXorPiiGyOVwcjYta3NYeaI9945f601b2
  body:
    type: json
    data: |-
      {
        // ==========================================
        // REQUIRED FIELDS
        // ==========================================
        
        "date": "2026-07-30",                    // Date of quotation/estimate
        "customer_name": "Rajesh Builders",      // Customer full name
        "customer_phone": "9876543210",          // Customer 10-digit phone number
        "items": [                               // At least 1 item required
          {
            "product_id": 12,                     // Product ID from products table
            "quantity": 100,                     // Quantity (minimum 0.01)
            "rate": 500.00                       // Rate per unit
          }
        ],
        
        // ==========================================
        // OPTIONAL FIELDS - Customer Details
        // ==========================================
        
        "customer_email": "rajesh@builders.com", // Customer email address
        "customer_address": "123 Main Street, City", // Customer address
        
        // ==========================================
        // OPTIONAL FIELDS - Contractor Details
        // ==========================================
        
        "contractor_name": "ABC Constructions",  // Contractor name
        "contractor_phone": "9876543211",        // Contractor phone
        "contractor_email": "abc@constructions.com", // Contractor email
        "contractor_address": "456 Contractor Road", // Contractor address
        
        // ==========================================
        // OPTIONAL FIELDS - General
        // ==========================================
        
        "notes": "Customer enquiry for new project", // Additional notes
        "terms_conditions": "Standard terms apply", // Terms and conditions
        "handling_charge": 500.00,               // Handling/Shipping charges
        
        // ==========================================
        // SITE VISIT INTEGRATION
        // ==========================================
        
        "site_visit_id": 1,                      // Link to existing pending site visit
        // How site_visit_id works:
        // 1. If site_visit_id provided → Uses that site visit data
        // 2. If no site_visit_id but phone matches pending site visit → Auto-link
        // 3. If no site_visit_id and no match → Manual customer entry
        
        // ==========================================
        // SALESMAN ASSIGNMENT (Owner only)
        // ==========================================
        
        "salesman_id": 10,                       // Assign estimate to specific salesman
        
        // ==========================================
        // ⭐ DISCOUNT FIELDS (Optional)
        // Only applicable when estimate is created as "approved"
        // ==========================================
        
        "discount_type": "percentage",           // Values: "percentage" or "fixed"
        "discount_value": 10,                    // For percentage: 10 = 10%, For fixed: 5000
        "discount_notes": "10% bulk discount",   // Reason for discount
        
        // ==========================================
        // ⭐ PAYMENT FIELDS (Optional)
        // Only applicable when estimate is created as "approved"
        // ==========================================
        
        "payment_amount": 30000.00,              // Amount received as payment
        "payment_method": "online",              // Values: cash, cheque, online, credit, bank_transfer (Default: cash)
        "payment_reference": "TXN123456",        // Cheque number, transaction ID, etc.
        "payment_date": "2026-07-30",            // Date of payment (Default: today)
        "payment_notes": "Advance payment"       // Payment notes
        
        // ==========================================
        // ⚠️ NOTE: Discount & Payment fields are ONLY used when:
        // 1. Estimate is being created directly as "approved"
        // 2. Estimate is being approved during creation (NOT in separate approve endpoint)
        // For separate approval, use POST /api/quotations/approve endpoint
        // ==========================================
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
