info:
  name: Salesman Create Quotation (Draft/Send for approval)
  type: http
  seq: 1

http:
  method: POST
  url: http://127.0.0.1:8000/api/quotations
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"date\": \"2026-07-27\",\r

      \    \"valid_until\": \"2026-08-27\",\r

      \    \"customer_name\": \"Rajesh Builders\",\r

      \    \"customer_phone\": \"9876543210\",\r

      \    \"items\": [\r

      \        {\r

      \            \"product_id\": 1,\r

      \            \"quantity\": 1000,\r

      \            \"rate\": 60\r

      \        }\r

      \    ],\r

      \    \"status\": \"draft\" //draft or sent (for salesman) \r

      }"
  auth:
    type: bearer
    token: "{{auth_secret_0mb8}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
